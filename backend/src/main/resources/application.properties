server.port=8080
spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/floranest_db?useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.floranest.backend.entity
logging.level.com.example.floranest.backend=debug

# LLM API Configuration (OpenAI-compatible)
llm.api.base-url=https://api.openai.com
llm.api.key=${LLM_API_KEY:your-api-key-here}
llm.api.model=gpt-3.5-turbo
llm.api.max-tokens=1024
llm.api.temperature=0.7
