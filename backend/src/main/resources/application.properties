server.port=8080
spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/floranest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.floranest.backend.entity
logging.level.com.example.floranest.backend=debug
spring.profiles.active=local

# Frontend origin(s) allowed for CORS (comma-separated if more than one).
# Adjust if the frontend is served from another port or a deployed URL.
app.cors.allowed-origins=http://localhost:5173

# Admin access password — required when creating an admin account
# from the "Sign Up" page (see Register.vue). Change it to anything you like.
app.admin.access-code=admin2026
